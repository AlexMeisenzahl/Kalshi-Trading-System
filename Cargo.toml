[package]
name        = "kalshi-claw-core"
version     = "0.1.0"
edition     = "2021"
description = "Native Rust core for Kalshi-Claw: RSA auth, orderbook parsing, hedge scoring, Kelly sizing"
license     = "MIT"

[lib]
crate-type = ["cdylib"]

[features]
default = ["napi"]
napi    = ["dep:napi", "dep:napi-derive"]

[dependencies]
# RSA signing
rsa    = { version = "0.9",  features = ["sha2", "pkcs1"] }
rand   = "0.8"
base64 = "0.22"

# napi-rs — Node.js native addon bridge
napi        = { version = "2.16", features = ["napi4"], optional = true }
napi-derive = { version = "2.16", optional = true }

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
